# Fork-only: checks that the headless Signal image still builds. Run it by
# hand after rebasing onto a new Signal release.
name: Backchannel image
on:
  push:
    branches:
      - main
    paths:
      - 'contrib/backchannel/**'
      - '.github/workflows/backchannel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          rc=0
          docker build --progress=plain -f contrib/backchannel/Dockerfile \
            -t backchannel . > build.log 2>&1 || rc=$?
          if [ "$rc" != 0 ]; then
            # Annotations can be read without downloading the full log.
            grep -E 'ERROR|ERR!|[Ee]rror|Trace|signal [0-9]|core dumped' build.log |
              tail -n 8 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            echo "::error::exit $rc; tail: $(tail -n 6 build.log | tr '\n' ' ' | cut -c1-900)"
          fi
          tail -n 200 build.log
          exit "$rc"
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'

      - name: Check the image
        run: |
          check() {
            local name="$1"; shift
            if "$@" > check.log 2>&1; then
              echo "::notice title=$name::$(tail -n 3 check.log | tr '\n' ' ')"
            else
              rc=$?
              tail -n 15 check.log | while IFS= read -r line; do
                echo "::error title=$name (exit $rc)::$line"
              done
              return $rc
            fi
          }
          check helper docker run --rm --entrypoint node backchannel \
            /opt/backchannel/backchannel.mjs --config /tmp/c --url || fail=1
          docker run -d --name smoke --shm-size 1g \
            --tmpfs /data:uid=1000,gid=1000 backchannel
          sleep 60
          check running docker inspect -f '{{.State.Status}}' smoke || fail=1
          check socket docker exec smoke sh -c \
            'ls /data/.config/Signal/external-client/' || fail=1
          # screen.sh qr fails when no QR code decodes; Signal can take a
          # while to show it.
          qr=fail
          for i in $(seq 36); do
            if docker exec smoke screen.sh qr > /dev/null 2> qr.err; then
              qr=ok; echo "::notice title=link-qr::QR code after $((i * 5)) s more"; break
            fi
            sleep 5
          done
          if [ "$qr" != ok ]; then
            echo "::error title=link-qr::$(cat qr.err)"; fail=1
          fi
          docker logs smoke > smoke.log 2>&1 || true
          grep -E 'FATAL|ERROR|Error' smoke.log | tail -n 20 | while IFS= read -r line; do
            echo "::warning title=smoke log::$line"
          done
          exit "${fail:-0}"
